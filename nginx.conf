server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's mime.types has no entry for the PWA manifest, which would be served as application/octet-stream
    include mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    # The VPS reverse proxy may forward requests over HTTP/1.0 or with a Via header, which nginx does not compress by default
    gzip_http_version 1.0;
    gzip_proxied any;

    # Hashed build output (main-PZ6XNHLP.js, styles-RDRCNQC7.css, media/*-T7KMQGUG.woff2): new content gets a new name, so cache forever
    location ~ "^/(media/)?[^/]+-[A-Z0-9]{8}\.(js|css|woff2?|ttf|png|jpe?g|gif|webp|avif|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else keeps its name across deployments (index.html, ngsw.json, ngsw-worker.js, public/ files):
    # revalidate on every use, or new deployments are not picked up
    location / {
        add_header Cache-Control "no-cache";
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }
}
