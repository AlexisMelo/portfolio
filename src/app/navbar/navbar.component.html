<ng-template #items>
  <app-social-link
    class="linkedin"
    network="linkedin"
    iconOnly></app-social-link>

  <app-social-link class="github" network="github" iconOnly></app-social-link>

  <div appGridItem class="theme-selector">
    <app-theme-selector></app-theme-selector>
  </div>

  <div appGridItem class="language-selector">
    <app-language-selector></app-language-selector>
  </div>

  <a
    [routerLink]="['']"
    [routerLinkActive]="['is-active', 'g-grid-item-highlight']"
    [routerLinkActiveOptions]="{ exact: true }"
    class="home"
    appGridItem
    ><h2>{{ 'navbar.about' | transloco }}</h2>
    <div class="img-container">
      <img
        ngSrc="photos/avatar-neutral.webp"
        width="112"
        height="98"
        [attr.alt]="'navbar.avatarAlt' | transloco" />
    </div>
  </a>

  <a
    [routerLink]="['projects']"
    [routerLinkActive]="['is-active', 'g-grid-item-highlight']"
    class="projects"
    appGridItem
    ><h2>{{ 'navbar.projects' | transloco }}</h2></a
  >

  <a
    [routerLink]="['skills']"
    [routerLinkActive]="['is-active', 'g-grid-item-highlight']"
    class="skills"
    appGridItem
    ><h2>{{ 'navbar.skills' | transloco }}</h2></a
  >

  <a
    class="experience"
    appGridItem
    [routerLink]="['experience']"
    [routerLinkActive]="['is-active', 'g-grid-item-highlight']"
    ><h2>{{ 'navbar.experience' | transloco }}</h2></a
  >
</ng-template>

<div
  #mobileMenu
  id="mobile-menu"
  class="collapsible-menu"
  [class.opened]="menuOpened()">
  <div class="g-grid-container">
    <div class="g-grid">
      <ng-template [ngTemplateOutlet]="items"></ng-template>
    </div>
  </div>
</div>

<div class="g-grid-container main-navbar">
  <div class="g-grid">
    <nav appGridItem class="g-grid-item-highlight">
      <div class="logo-name" [routerLink]="['']">
        <h1>Melo</h1>
      </div>

      <div id="links-large-screen">
        <a
          [routerLink]="['']"
          [routerLinkActive]="['is-active']"
          [routerLinkActiveOptions]="{ exact: true }">
          <h2>{{ 'navbar.about' | transloco }}</h2></a
        >

        <a [routerLink]="['projects']" [routerLinkActive]="['is-active']">
          <h2>{{ 'navbar.projects' | transloco }}</h2>
        </a>
        <a [routerLink]="['skills']" [routerLinkActive]="['is-active']">
          <h2>{{ 'navbar.skills' | transloco }}</h2>
        </a>
        <a [routerLink]="['experience']" [routerLinkActive]="['is-active']">
          <h2>{{ 'navbar.experience' | transloco }}</h2>
        </a>

        <div class="separator"></div>

        <app-language-selector></app-language-selector>
        <app-theme-selector></app-theme-selector>
      </div>

      <button
        #menuButton
        type="button"
        class="open-menu"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpened()"
        [attr.aria-label]="
          (menuOpened() ? 'navbar.closeMenu' : 'navbar.openMenu') | transloco
        "
        (click)="toggleMenu()">
        <mat-icon class="large" aria-hidden="true">
          @if (menuOpened()) {
            close
          } @else {
            menu
          }
        </mat-icon>
      </button>
    </nav>

    <ng-template [ngTemplateOutlet]="items"></ng-template>
  </div>
</div>
