<div class="g-grid-container">
  <div class="g-grid" appGridEntrance appGridDrag>
    <app-image></app-image>
    <app-social-link class="linkedin" network="linkedin"></app-social-link>
    <app-social-link class="github" network="github"></app-social-link>
    <app-description></app-description>
    <app-mail></app-mail>
    <app-map></app-map>
    <app-availability></app-availability>
    <app-resume></app-resume>
    <app-now></app-now>

    @for (i of 3 | range; track i) {
      <app-project-item
        [class]="'project__' + (i + 1)"
        [project]="pinnedProjects()[i]"></app-project-item>
    }
  </div>
</div>
