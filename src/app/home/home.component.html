<div class="g-grid-container">
  <div class="g-grid" appGridEntrance>
    <app-image></app-image>
    <div class="linkedin" appGridItem>
      <app-linkedin></app-linkedin>
    </div>
    <div class="github g-grid-item-highlight" appGridItem>
      <app-github [link]="contentService.github"></app-github>
    </div>
    <app-description></app-description>
    <app-mail></app-mail>
    <app-map></app-map>
    <app-availability></app-availability>
    <app-resume></app-resume>
    <app-now></app-now>

    @for (i of 3 | range; track i) {
      <app-project-item
        [class]="'project__' + (i + 1)"
        [project]="pinnedProjects()[i]"></app-project-item>
    }
  </div>
</div>
