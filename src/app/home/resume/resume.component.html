<h2>
  Curriculum <br />
  Vitae
</h2>

<button
  type="button"
  class="illustration-container"
  (mouseenter)="requestPreview()"
  (focus)="requestPreview()"
  (click)="openResume()">
  <img
    ngSrc="illustrations/resume-preview.webp"
    width="240"
    height="340"
    [alt]="'home.resume.open' | transloco" />
</button>

<div class="actions">
  <button type="button" app-action-button (click)="downloadResume()">
    {{ 'home.resume.download' | transloco }}
  </button>

  <button
    type="button"
    app-action-button
    icon="visibility"
    [attr.aria-label]="'home.resume.open' | transloco"
    (mouseenter)="requestPreview()"
    (focus)="requestPreview()"
    (click)="openResume()"></button>
</div>

<div #modal id="modal-container">
  <div class="modal-background">
    <div class="modal" appOutsideClick (outsideClick)="closeResume()">
      @if (resumePreviewUrl(); as previewUrl) {
        <img
          class="modal-img"
          [ngSrc]="previewUrl"
          width="595"
          height="842"
          loading="eager"
          [alt]="'home.resume.screenshot' | transloco" />
      }
    </div>
  </div>
</div>
