<div #mapFrame class="map-frame">
  <!-- Leaflet loads on the first hover, focus, click or key press in the tile -->
  @defer (on hover(mapFrame); on interaction(mapFrame)) {
    <app-leaflet-map
      role="img"
      [attr.aria-label]="'home.map.alt' | transloco"
      [zoom]="zoomLevel()"
      (loaded)="tilesLoaded.set(true)"></app-leaflet-map>
  }

  @if (!tilesLoaded()) {
    <img
      class="map-image"
      [ngSrc]="'map/' + themeService.theme() + '.webp'"
      [alt]="'home.map.alt' | transloco"
      width="400"
      height="200"
      priority
      animate.leave="map-image-leave" />
  }

  @if (canZoomOut()) {
    <button
      #zoomOutButton
      type="button"
      class="zoom-button"
      app-action-button
      icon="remove"
      position="bottom-left"
      [attr.aria-label]="'home.map.zoomOut' | transloco"
      (click)="zoomOut()"></button>
  }

  @if (canZoomIn()) {
    <button
      #zoomInButton
      type="button"
      class="zoom-button"
      app-action-button
      icon="add"
      position="bottom-right"
      [attr.aria-label]="'home.map.zoomIn' | transloco"
      (click)="zoomIn()"></button>
  }

  <p class="location">
    <mat-icon class="small" aria-hidden="true">location_on</mat-icon>
    {{ 'home.map.location' | transloco }}
  </p>

  <div class="rayon"></div>
  <img
    class="img-marker"
    ngSrc="photos/avatar-neutral.webp"
    width="112"
    height="98"
    alt="" />
</div>
