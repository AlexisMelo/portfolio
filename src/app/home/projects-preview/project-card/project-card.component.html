<div class="header">
  <!-- Placeholder number, not defined yet: hidden from screen readers meanwhile -->
  <span aria-hidden="true">{{
    'projectCard.number' | transloco: { number: 'X' }
  }}</span>
  <span>{{ year() }}</span>
</div>

<div class="illustration-area">
  <div class="illustration">
    @if (illustration(); as illustration) {
      <img [ngSrc]="illustration.url" [alt]="illustration.alt" fill />
    } @else {
      <!-- No illustration: the icon of the project, or its initial -->
      @if (project().icon; as icon) {
        <img class="icon" [ngSrc]="icon" alt="" fill />
      } @else {
        <span class="initial" aria-hidden="true">{{
          project().label.charAt(0)
        }}</span>
      }
    }
  </div>
</div>

<h2>{{ project().label }}</h2>
<p class="description">{{ description() }}</p>

<div class="footer">
  <span class="context">{{ context() }}</span>
  <a
    class="details-link g-round-button"
    [routerLink]="[PROJECTS_ROUTE, project().url]"
    [attr.aria-label]="
      'projectCard.details' | transloco: { label: project().label }
    ">
    <mat-icon aria-hidden="true">call_made</mat-icon>
  </a>
</div>
