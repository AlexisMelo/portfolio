<div
  class="chips"
  role="group"
  [attr.aria-label]="'experience.filter.label' | transloco">
  <button
    type="button"
    class="g-chip"
    [attr.aria-pressed]="selectedKind() === null"
    (click)="selectedKind.set(null)">
    {{ 'experience.filter.all' | transloco }}
    @if (contexts().length > 0) {
      <span class="count">{{ contexts().length }}</span>
    }
  </button>

  @for (chip of kinds(); track chip.kind) {
    <button
      type="button"
      class="g-chip"
      [class]="chip.kind"
      [attr.aria-pressed]="selectedKind() === chip.kind"
      (click)="selectedKind.set(chip.kind)">
      <mat-icon aria-hidden="true">{{ chip.icon }}</mat-icon>
      {{ 'experience.filter.' + chip.kind | transloco }}
      @if (contexts().length > 0) {
        <span class="count">{{ chip.count }}</span>
      }
    </button>
  }
</div>
