<div class="g-grid-container">
  <div
    class="g-grid"
    appGridEntrance
    staggerAddedTiles
    [replayKey]="shownKey()"
    replaySelector="app-experience-card"
    appGridDrag>
    <app-experience-heading
      [contexts]="baseContexts()"
      [shownContexts]="shownContexts()"></app-experience-heading>

    <app-resume></app-resume>

    <app-experience-filtering
      [(selectedKind)]="selectedKind"></app-experience-filtering>

    @for (context of shownContexts(); track context.id) {
      <app-experience-card [context]="context"></app-experience-card>
    }

    <app-contact-tile
      [heading]="'experience.yourCompany.title' | transloco"
      [subtitle]="'experience.yourCompany.subtitle' | transloco"
      [action]="'experience.yourCompany.action' | transloco"></app-contact-tile>
  </div>
</div>
