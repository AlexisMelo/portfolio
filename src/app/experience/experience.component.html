<div class="g-grid-container">
  <div class="g-grid" appGridEntrance staggerAddedTiles appGridDrag>
    <app-resume></app-resume>

    <app-availability></app-availability>

    @for (context of baseContexts(); track context.id) {
      @let lang = languageService.currentLang();
      <app-key-header
        [style.--index]="$index"
        [chips]="[context.localization]"
        >{{ context.localizedLabel[lang] ?? context.label }}</app-key-header
      >
      <app-experience-description
        [style.--index]="$index"
        [context]="context"></app-experience-description>
      <app-experience-duration
        [style.--index]="$index"
        [context]="context"></app-experience-duration>
      <app-experience-projects
        [style.--index]="$index"
        [context]="context"></app-experience-projects>
    }
  </div>
</div>
