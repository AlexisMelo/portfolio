<div class="g-grid-container">
  <div
    class="g-grid"
    appGridEntrance
    staggerAddedTiles
    [replayKey]="shownKey()"
    replaySelector="app-key-header, app-experience-description, app-experience-duration, app-experience-projects"
    appGridDrag>
    <app-experience-heading
      [contexts]="baseContexts()"
      [shownContexts]="shownContexts()"></app-experience-heading>

    <app-your-company></app-your-company>

    <app-resume></app-resume>

    <app-experience-filtering
      [contexts]="baseContexts()"
      [(selectedKind)]="selectedKind"></app-experience-filtering>

    @for (context of shownContexts(); track context.id) {
      @let lang = languageService.currentLang();
      <app-key-header
        [style.--index]="$index"
        [chips]="[context.localization]"
        >{{ context.localizedLabel[lang] ?? context.label }}</app-key-header
      >
      <app-experience-description
        [style.--index]="$index"
        [context]="context"></app-experience-description>
      <app-experience-duration
        [style.--index]="$index"
        [context]="context"></app-experience-duration>
      <app-experience-projects
        [style.--index]="$index"
        [context]="context"></app-experience-projects>
    }
  </div>
</div>
