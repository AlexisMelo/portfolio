@if (project(); as p) {
  <h2>{{ p.label }}</h2>
  <p>{{ description() }}</p>

  @if (firstIllustration(); as illu) {
    <div class="illustration-container">
      <img [ngSrc]="illu.url" [alt]="illu.alt" fill />
    </div>
  }

  <app-project-item-skill-list
    [skills]="highlightedSkills()"></app-project-item-skill-list>
}
