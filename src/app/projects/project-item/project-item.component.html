@if (!project()) {
  <app-loader></app-loader>
} @else {
  <h2>{{ project().label }}</h2>

  <p>{{ description() }}</p>

  <div>
    <app-project-item-skill-list
      [skills]="skills()"></app-project-item-skill-list>
  </div>

  @if (firstIllustration()) {
    <div class="illustration-container">
      <img
        [ngSrc]="firstIllustration().url"
        [alt]="firstIllustration().alt"
        [priority]="priority()"
        fill />
    </div>
  }
}
