<h2>{{ project().label }}</h2>

<p>{{ description() }}</p>

<div>
  <app-project-item-skill-list
    [skills]="skills()"></app-project-item-skill-list>
</div>

@if (firstIllustration(); as illustration) {
  <div class="illustration-container">
    <img
      [ngSrc]="illustration.url"
      [alt]="illustration.alt"
      [priority]="priority()"
      fill />
  </div>
}
