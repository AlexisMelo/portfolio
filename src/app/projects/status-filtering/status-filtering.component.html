<p class="title" [id]="titleId">
  {{ 'projects.statusFilter.label' | transloco }}
</p>

<div class="chips" role="group" [attr.aria-labelledby]="titleId">
  @for (status of statuses; track status) {
    <button
      type="button"
      class="g-chip"
      [class]="status"
      [attr.aria-pressed]="projectsService.selectedStatus() === status"
      (click)="toggle(status)">
      <span class="dot" aria-hidden="true"></span>
      {{ 'projects.statusFilter.' + status | transloco }}
    </button>
  }
</div>
