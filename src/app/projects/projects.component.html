<div class="g-grid-container">
  <div
    class="g-grid"
    appGridEntrance
    appGridDrag
    [replayKey]="resultsKey()"
    replaySelector="app-key-header, app-project-item">
    <app-skill-section-description
      [mainText]="'projects.heading' | transloco"
      [secondaryText]="
        'projects.description' | transloco
      "></app-skill-section-description>

    <app-project-counter></app-project-counter>

    <app-status-filtering></app-status-filtering>

    <app-project-filtering></app-project-filtering>

    <app-order></app-order>

    <app-your-project></app-your-project>
    <app-ongoing></app-ongoing>
    <app-with-skill></app-with-skill>
    <app-social-link class="github" network="github"></app-social-link>

    @for (group of projectsService.sortedGroupedProjects(); track group.key) {
      @let chipLabel =
        'projects.chips' | transloco: { count: group.projects.length };
      <app-key-header [chips]="[chipLabel]">
        {{ group.key }}
      </app-key-header>

      @for (project of group.projects; track project.id) {
        <app-project-item [project]="project"></app-project-item>
      }
    }
  </div>
</div>
