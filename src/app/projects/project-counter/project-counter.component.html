<p class="g-visually-hidden" aria-live="polite">
  @if (projectsService.loaded()) {
    {{ 'projects.counter.label' | transloco: { count, total } }}
  }
</p>

<p class="numerator" aria-hidden="true">{{ count() }}</p>
<div class="separator"></div>
<p class="denominator" aria-hidden="true">{{ total() }}</p>

@if (count() < total()) {
  <button
    type="button"
    class="reset"
    app-action-button
    icon="undo"
    [attr.aria-label]="'projects.clearFilters' | transloco"
    (click)="projectsService.clearFiltering()"></button>
}
