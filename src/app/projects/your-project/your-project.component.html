<a class="row" [href]="'mailto:' + contentService.mail">
  <span class="number">{{
    'projects.list.number' | transloco: { number: number() }
  }}</span>

  <h2 class="title">{{ 'projects.yourProject.title' | transloco }}</h2>

  <p class="subtitle">{{ 'projects.yourProject.subtitle' | transloco }}</p>

  <!-- Only the look of a button: the whole row is the link -->
  <span class="action" app-action-button icon="mail">
    {{ 'projects.yourProject.action' | transloco }}
  </span>
</a>
