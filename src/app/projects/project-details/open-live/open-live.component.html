@if (url(); as url) {
  <a class="content" [href]="url" target="_blank" rel="noopener">
    <h2>
      <app-dot color="var(--open-live-dot-color)"></app-dot>
      {{ 'projectDetails.openLive.online' | transloco }}
    </h2>
    <p>{{ 'projectDetails.openLive.accessible' | transloco }}</p>
    <mat-icon class="move" aria-hidden="true">call_made</mat-icon>
  </a>
} @else {
  <div class="content">
    <h2>{{ 'projectDetails.openLive.offline' | transloco }}</h2>
    <p>{{ 'projectDetails.openLive.private' | transloco }}</p>
    <mat-icon aria-hidden="true">lock</mat-icon>
  </div>
}
