<div class="controls">
  <button
    type="button"
    app-action-button
    icon="chevron_left"
    (click)="nextSlide(-1)">
    {{ 'projectDetails.illustrationsDialog.previous' | transloco }}
  </button>

  <button type="button" app-action-button icon="close" (click)="closeDialog()">
    {{ 'projectDetails.illustrationsDialog.close' | transloco }}
  </button>

  <button
    type="button"
    app-action-button
    icon="chevron_right"
    iconEnd
    (click)="nextSlide(1)">
    {{ 'projectDetails.illustrationsDialog.next' | transloco }}
  </button>
</div>

<div class="carousel-items-modal">
  @for (illustration of data.illustrations; track illustration.id) {
    <div class="carousel-item-modal">
      <img [src]="illustration.url" [alt]="illustration.alt" />

      <p class="legend" aria-hidden="true">{{ illustration.alt }}</p>
    </div>
  }
</div>
