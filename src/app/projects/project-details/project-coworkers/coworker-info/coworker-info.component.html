<div class="avatar-container">
  <img
    [ngSrc]="image"
    [alt]="'projectDetails.coworkers.photoAlt' | transloco: { name: name }"
    fill />
</div>

<h3>
  {{ name }}
  @if (url) {
    <app-action-button icon="link" (click)="openInfos()"></app-action-button>
  }
</h3>

<p>{{ description }}</p>
