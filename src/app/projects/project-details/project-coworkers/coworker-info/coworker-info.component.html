<div class="avatar-container">
  <img
    [ngSrc]="image"
    [alt]="'projectDetails.coworkers.photoAlt' | transloco: { name: name }"
    fill />
</div>

<h3>
  {{ name }}
  @if (url) {
    <a
      class="profile"
      app-action-button
      icon="link"
      target="_blank"
      rel="noopener"
      [href]="url"
      [attr.aria-label]="
        'projectDetails.coworkers.profile' | transloco: { name: name }
      "></a>
  }
</h3>

<p>{{ description }}</p>
