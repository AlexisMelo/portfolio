<div>
  <h2>{{ 'skills.keepLearning.title' | transloco }}</h2>

  <p>{{ 'skills.keepLearning.description' | transloco }}</p>
</div>

<div>
  <h3>{{ 'skills.keepLearning.skillsTitle' | transloco }}</h3>

  <ul>
    @for (skill of skills(); track skill.id) {
      <li>{{ skill.label }}</li>
    }
  </ul>
</div>
