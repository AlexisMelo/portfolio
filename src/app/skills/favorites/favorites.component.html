<h2>{{ 'skills.favorites.title' | transloco }}</h2>

<ul [attr.aria-label]="'skills.favorites.listLabel' | transloco">
  @for (sticker of stickers(); track sticker.skill.id) {
    <li>
      <a
        [class]="'sticker ' + sticker.brandClass"
        [routerLink]="PROJECTS_ROUTE"
        [queryParams]="{ skills: sticker.skill.id }"
        [attr.aria-label]="
          'skills.favorites.projectsLink'
            | transloco: { name: sticker.skill.label }
        "
        >{{ sticker.skill.label }}</a
      >
    </li>
  }
</ul>
