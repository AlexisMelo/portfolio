<p class="g-visually-hidden" aria-live="polite">
  @if (total() > 0) {
    {{ 'skills.heading.shown' | transloco: { count: count(), total: total() } }}
  }
</p>

@if (total() > 0 && year() !== null) {
  <app-count-title
    animate.enter="g-fade-in"
    [count]="count()"
    [total]="total()"
    [year]="year()"
    [noun]="
      'skills.heading.skills' | transloco: { count: count() }
    "></app-count-title>
}
